name: Bug report
description: Report reproducible incorrect behavior in Open Evals
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for helping improve Open Evals. Remove API keys, private prompts, model output,
        and other sensitive data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide a minimal command or sanitized configuration and the steps to reproduce.
      placeholder: |
        1. Start ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Open Evals version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version, inference server and version, and model.
      placeholder: Ubuntu 24.04; Python 3.12; vLLM x.y; model-name
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized output or logs
      description: Paste relevant output. GitHub will format this automatically.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and sensitive benchmark data.
          required: true
        - label: This is not a security vulnerability.
          required: true
